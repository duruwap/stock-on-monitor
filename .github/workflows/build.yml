name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      download_base_url:
        description: "설치 파일을 올릴 웹 주소 (latest.json 의 url 에 사용)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 실행 라이브러리
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  installer:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # 태그 빌드 시 릴리스 생성
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Inno Setup 확인
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: 설치 파일 빌드
        shell: pwsh
        run: >
          ./packaging/build.ps1 -Python python
          -DownloadBaseUrl "${{ github.event.inputs.download_base_url || vars.DOWNLOAD_BASE_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: StockOnMonitor-installer
          path: |
            build/installer/*.exe
            build/installer/latest.json
          if-no-files-found: error
      - name: 릴리스 생성 (태그 빌드)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/installer/*.exe
            build/installer/latest.json
          draft: true
